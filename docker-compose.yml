version: "3.9"

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.72.2
    container_name: doco-cd
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./doco-cd-data:/app/data       # persistent logs/cache
      - /var/run/docker.sock:/var/run/docker.sock  # needed for docker-compose deploys
    ports:
      - "9080:80"  # optional health/metrics endpoint
    environment:
      PASS_ENV: "true"
      POLL_CONFIG: |   
        - url: https://github.com/kekizl/home-infra.git
          reference: main 
          interval: 1800 
          target: ${DOCO_CD_TARGET}
