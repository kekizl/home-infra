version: "3.9"

services:
  ts-openwebui:
    image: tailscale/tailscale:v1.96.5
    container_name: ts-openwebui
    hostname: openwebui
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json   # optional, enables HTTPS
      - TS_USERSPACE=true 
    volumes:
      - tailscale-data-openwebui:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/ai/ts-openwebui-config:/config          # mount folder for serve.json
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
  
  openwebui:
    image: ghcr.io/open-webui/open-webui:v0.9.2
    container_name: openwebui
    restart: unless-stopped
    network_mode: service:ts-openwebui
    depends_on:
      - ts-openwebui
    secrets:
      - webui_secret_key
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_SECRET_KEY_FILE: /run/secrets/webui_secret_key 
    volumes:
      - openwebui-data:/app/backend/data
    labels:
      - "docker-volume-backup.stop-during-backup=true"

  agent-documentation:
    image: ghcr.io/anthropics/claude-code:latest
    stdin_open: true
    tty: true
    environment:
      ANTHROPIC_BASE_URL: http://host.docker.internal:8080
      ANTHROPIC_API_KEY: local
      CLAUDE_MODEL: qwen2.5-7b
    volumes:
      - ~/home-infra/mac-mini/obsidian/vault:/vault:rw
      - ./CLAUDE.md:/workspace/CLAUDE.md:ro
    working_dir: /vault
    security_opt: [no-new-privileges:true]
 
volumes:
  openwebui-data:
  tailscale-data-openwebui:
    driver: local

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
  webui_secret_key:    
    file: ../../secrets/webui-secret-key.enc.txt
