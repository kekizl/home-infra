version: "3.9"

services:
  ts-adguard:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-adguard
    hostname: adguard
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json   # optional, enables HTTPS
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-adguard:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/dns/ts-adguard-config:/config          # mount folder for serve.json
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  adguard-home:
    image: adguard/adguardhome:v0.107.80@sha256:e2e1b48c832f7705be915873f95de0d5114de573736441d7f2923a8a6293027c
    container_name: adguardhome
    restart: unless-stopped
    network_mode: service:ts-adguard
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - ts-adguard
    volumes:
      - ${INFRA_ROOT}/mac-mini/dns/adguard/work:/opt/adguardhome/work
      - ${INFRA_ROOT}/mac-mini/dns/adguard/conf:/opt/adguardhome/conf
    labels:
      - "docker-volume-backup.stop-during-backup=true"

volumes:
  tailscale-data-adguard:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
