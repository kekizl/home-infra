version: "3.8"

services:
  ts-syncthing:
    image: tailscale/tailscale:v1.102.5
    container_name: ts-syncthing
    hostname: syncthing
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-syncthing:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/syncthing/ts-syncthing-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  syncthing:
    image: ghcr.io/vaskozl/syncthing:2.1.6@sha256:d4530bb25316ad0cea0c3fa013e126d73fcf3e3ec6803a7c3c0140062d1fb33f
    container_name: syncthing
    restart: unless-stopped
    network_mode: service:ts-syncthing
    depends_on:
      - ts-syncthing
    user: "568:568"
    environment:
      - HOME=/var/syncthing
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ${INFRA_ROOT}/nas/syncthing/data:/var/syncthing/.local/state/syncthing
      - /mnt/Pool/sync-bucket:/incoming
      - /mnt/Pool/Syncthing/vw:/sync/vw

volumes:
  tailscale-data-syncthing:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
