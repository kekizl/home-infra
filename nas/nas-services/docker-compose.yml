version: '3.8'

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v1.117.0
    volumes:
      - /mnt/Pool/App_Storage/immich/data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - /mnt/Pool/home-infra/home-infra/nas/nas-services/.env
    ports:
      - 2283:3001
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v1.117.0
    volumes:
      - model-cache:/cache
    env_file:
      - /mnt/Pool/home-infra/home-infra/nas/nas-services/.env
    restart: always

  redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    restart: always

  database:
    container_name: immich_postgres
    image: tensorchord/pgvecto-rs:pg14-v0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - /mnt/Pool/App_Storage/immich/postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  model-cache:
