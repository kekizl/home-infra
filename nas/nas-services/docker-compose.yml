version: '3.8'

services:
  ts-immich:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-immich
    hostname: immich
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: tiny
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-immich:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-immich-config:/config
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.2@sha256:fc880c1bf665b4aab1e74c15e56ab871225989cd546536e6b77e771869af06bd
    extends:
      file: ../../common/limits.yml
      service: large
    mem_limit: 3g
    volumes:
      - ${APPSTORAGE_ROOT}/immich/data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - IMMICH_SERVER_EXTERNAL_DOMAIN=https://immich.${TS_TAILNET}.ts.net
    env_file:
      - ./db_secrets.enc.env
    network_mode: service:ts-immich
    depends_on:
      - ts-immich
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.2@sha256:739405742a79bd7447227c553bb62ed5491aa36acf00bc667af7f9c93b6fae91
    extends:
      file: ../../common/limits.yml
      service: large
    mem_limit: 4g
    cpus: 2
    env_file:
      - ./db_secrets.enc.env
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056
    extends:
      file: ../../common/limits.yml
      service: small
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    extends:
      file: ../../common/limits.yml
      service: large
    env_file:
      - ./db_secrets.enc.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${APPSTORAGE_ROOT}/immich/immich_postgres16:/var/lib/postgresql/data
    restart: always

  ts-audiobookshelf:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-audiobookshelf
    hostname: audiobookshelf
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: tiny
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-audiobookshelf:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-audiobookshelf-config:/config
    restart: unless-stopped

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.38.0@sha256:60064c23f32fd9099fd39e82c5132c51701d1221135bbca04cd099b589e1edc3
    user: "568:568"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: small
    network_mode: service:ts-audiobookshelf
    depends_on:
      - ts-audiobookshelf
    volumes:
      - ${APPSTORAGE_ROOT}/Audiobookshelf/audiobooks:/audiobooks
      - ${APPSTORAGE_ROOT}/Audiobookshelf/podcasts:/podcasts
      - ${APPSTORAGE_ROOT}/Audiobookshelf/manga:/manga
      - ${APPSTORAGE_ROOT}/Audiobookshelf/config:/config
      - ${APPSTORAGE_ROOT}/Audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Stockholm
      - PUBLIC_URL=https://audiobookshelf.${TS_TAILNET}.ts.net
    restart: unless-stopped

  ts-navidrome:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-navidrome
    hostname: navidrome
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: tiny
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-navidrome:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-navidrome-config:/config
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    network_mode: service:ts-navidrome
    depends_on:
      - ts-navidrome
    user: 568:568
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: small
    environment:
      - ND_DATAFOLDER=/data
      - ND_MUSICFOLDER=/music
      - ND_PORT=4533
      - ND_LOGLEVEL=info
    volumes:
      - ${APPSTORAGE_ROOT}/Navidrome/data:/data
      - ${APPSTORAGE_ROOT}/Navidrome/music:/music:ro

  ts-freshrss:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-freshrss
    hostname: freshrss
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    extends:
      file: ../../common/limits.yml
      service: tiny
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-freshrss:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-freshrss-config:/config
    restart: unless-stopped

  freshrss:
    image: lscr.io/linuxserver/freshrss:1.29.1@sha256:7f7f276244da91720e40fee50dd0895b5d59d7888ea75a404ec7495c46fbfbb6
    container_name: freshrss
    network_mode: service:ts-freshrss
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
    security_opt:
      - no-new-privileges:true
    extends:
      file: ../../common/limits.yml
      service: small
    volumes:
      - ${INFRA_ROOT}/nas/nas-services/freshrss/config:/config
    restart: unless-stopped

  ts-otterwiki:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-otterwiki
    hostname: otterwiki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: tiny
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-otterwiki:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-otterwiki-config:/config
    restart: unless-stopped

  otterwiki:
    image: redimp/otterwiki:2-slim@sha256:e7d7fea961ca314fb348b855df3afa63ba22ad12799392acc85348aedac6229c
    container_name: otterwiki
    restart: unless-stopped
    network_mode: service:ts-otterwiki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: small
    depends_on:
      - ts-otterwiki
    user: "568:568"
    environment:
      - TZ=Europe/Stockholm
      - AUTH_METHOD=SIMPLE
      - READ_ACCESS=APPROVED
      - WRITE_ACCESS=APPROVED
      - ATTACHMENT_ACCESS=APPROVED
      - DISABLE_REGISTRATION=False
      - AUTO_APPROVAL=False
      - EMAIL_NEEDS_CONFIRMATION=False
    volumes:
      - ${INFRA_ROOT}/nas/nas-services/otterwiki:/app-data

volumes:
  model-cache:
  tailscale-data-immich:
  tailscale-data-audiobookshelf:
  tailscale-data-navidrome:
  tailscale-data-freshrss:
  tailscale-data-otterwiki:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
