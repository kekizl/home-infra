services:

  ts-homepage:
    image: tailscale/tailscale:v1.96.5
    container_name: ts-homepage
    hostname: homepage                     # becomes homepage.<tailnet>.ts.net
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json   # optional, enables HTTPS
      - TS_USERSPACE=true 
    volumes:
      - tailscale-data-homepage:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/services/ts-homepage-config:/config          # mount folder for serve.json
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:v1.12.3
    container_name: homepage
    network_mode: service:ts-homepage
    depends_on:
      - ts-homepage
    volumes:
      - ${INFRA_ROOT}/mac-mini/services/homepage/config:/app/config
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.${TS_TAILNET}.ts.net
      PGHOMEPAGE_VAR_YOURVAR: value # optional env vars for secrets
 
  ts-vaultwarden:
    image: tailscale/tailscale:v1.96.5
    container_name: ts-vaultwarden
    hostname: vaultwarden
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-vaultwarden:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/services/ts-vaultwarden-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:1.35.8
    container_name: vaultwarden
    restart: unless-stopped
    network_mode: service:ts-vaultwarden
    depends_on:
      - ts-vaultwarden
    environment:
      DOMAIN: https://vaultwarden.${TS_TAILNET}.ts.net
      TRUST_PROXY: true
    volumes:
      - ${INFRA_ROOT}/mac-mini/services/vw-data/:/data/

volumes:
  tailscale-data-homepage:
    driver: local
  tailscale-data-vaultwarden: 

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
