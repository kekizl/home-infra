global:
  scrape_interval: 30s

scrape_config_files:
  - /etc/prometheus/secrets/ha-scrape.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor.tail1e4516.ts.net:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ['node-exporter.tail1e4516.ts.net:9100']

  - job_name: "truenas"
    static_configs:
      - targets: ["graphite-exporter.tail1e4516.ts.net:9108"]

  - job_name: "nas-node-exporter"
    static_configs:
      - targets: ['nas-node-exporter.tail1e4516.ts.net:9100']
