version: '3.8'

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v2.5.6
    volumes:
      - ${APPSTORAGE_ROOT}/immich/data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - ${INFRA_ROOT}/nas/nas-services/.env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.5.6
    env_file:
      - ${INFRA_ROOT}/nas/nas-services/.env
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.0.3
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    env_file:
      - ${INFRA_ROOT}/nas/nas-services/.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${APPSTORAGE_ROOT}/immich/immich_postgres:/var/lib/postgresql/data
    restart: always

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.33.0
    ports:
      - 30067:80
    volumes:
      - ${APPSTORAGE_ROOT}/Audiobookshelf/audiobooks:/audiobooks
      - ${APPSTORAGE_ROOT}/Audiobookshelf/podcasts:/podcasts
      - ${APPSTORAGE_ROOT}/Audiobookshelf/config:/config
      - ${APPSTORAGE_ROOT}/Audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped

volumes:
  model-cache:
