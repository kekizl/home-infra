version: '3.8'

services:
  ts-immich:
    image: tailscale/tailscale:v1.96.5
    container_name: ts-immich
    hostname: immich
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-immich:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-immich-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v2.7.4
    volumes:
      - ${APPSTORAGE_ROOT}/immich/data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - IMMICH_SERVER_EXTERNAL_DOMAIN=https://immich.${TS_TAILNET}.ts.net
    env_file:
      - ${INFRA_ROOT}/nas/nas-services/.env
    network_mode: service:ts-immich
    depends_on:
      - ts-immich
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v2.7.4
    env_file:
      - ${INFRA_ROOT}/nas/nas-services/.env
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.0.3
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    env_file:
      - ${INFRA_ROOT}/nas/nas-services/.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${APPSTORAGE_ROOT}/immich/immich_postgres16:/var/lib/postgresql/data
    restart: always

  ts-audiobookshelf:
    image: tailscale/tailscale:v1.96.5
    container_name: ts-audiobookshelf
    hostname: audiobookshelf
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-audiobookshelf:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-audiobookshelf-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.33.1
    network_mode: service:ts-audiobookshelf
    depends_on:
      - ts-audiobookshelf
    volumes:
      - ${APPSTORAGE_ROOT}/Audiobookshelf/audiobooks:/audiobooks
      - ${APPSTORAGE_ROOT}/Audiobookshelf/podcasts:/podcasts
      - ${APPSTORAGE_ROOT}/Audiobookshelf/config:/config
      - ${APPSTORAGE_ROOT}/Audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Stockholm
      - PUBLIC_URL=https://audiobookshelf.${TS_TAILNET}.ts.net
    restart: unless-stopped

  ts-navidrome:
    image: tailscale/tailscale:v1.96.5
    container_name: ts-navidrome
    hostname: navidrome
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-navidrome:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-navidrome-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:0.61.2
    container_name: navidrome
    network_mode: service:ts-navidrome
    depends_on:
      - ts-navidrome
    user: 568:568
    restart: unless-stopped
    environment:
      - ND_DATAFOLDER=/data
      - ND_MUSICFOLDER=/music
      - ND_PORT=4533
      - ND_LOGLEVEL=info
    volumes:
      - ${APPSTORAGE_ROOT}/Navidrome/data:/data
      - ${APPSTORAGE_ROOT}/Navidrome/music:/music:ro

volumes:
  model-cache:
  tailscale-data-immich:
  tailscale-data-audiobookshelf:
  tailscale-data-navidrome:
