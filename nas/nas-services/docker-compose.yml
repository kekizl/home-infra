version: '3.8'

services:
  ts-immich:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-immich
    hostname: immich
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-immich:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-immich-config:/config
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    volumes:
      - ${APPSTORAGE_ROOT}/immich/data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - IMMICH_SERVER_EXTERNAL_DOMAIN=https://immich.${TS_TAILNET}.ts.net
    env_file:
      - ./db_secrets.enc.env
    network_mode: service:ts-immich
    depends_on:
      - ts-immich
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
    env_file:
      - ./db_secrets.enc.env
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
    env_file:
      - ./db_secrets.enc.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${APPSTORAGE_ROOT}/immich/immich_postgres16:/var/lib/postgresql/data
    restart: always

  ts-audiobookshelf:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-audiobookshelf
    hostname: audiobookshelf
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-audiobookshelf:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-audiobookshelf-config:/config
    restart: unless-stopped

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    user: "568:568"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: service:ts-audiobookshelf
    depends_on:
      - ts-audiobookshelf
    volumes:
      - ${APPSTORAGE_ROOT}/Audiobookshelf/audiobooks:/audiobooks
      - ${APPSTORAGE_ROOT}/Audiobookshelf/podcasts:/podcasts
      - ${APPSTORAGE_ROOT}/Audiobookshelf/manga:/manga
      - ${APPSTORAGE_ROOT}/Audiobookshelf/config:/config
      - ${APPSTORAGE_ROOT}/Audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Stockholm
      - PUBLIC_URL=https://audiobookshelf.${TS_TAILNET}.ts.net
    restart: unless-stopped

  ts-navidrome:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-navidrome
    hostname: navidrome
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-navidrome:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-navidrome-config:/config
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    network_mode: service:ts-navidrome
    depends_on:
      - ts-navidrome
    user: 568:568
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - ND_DATAFOLDER=/data
      - ND_MUSICFOLDER=/music
      - ND_PORT=4533
      - ND_LOGLEVEL=info
    volumes:
      - ${APPSTORAGE_ROOT}/Navidrome/data:/data
      - ${APPSTORAGE_ROOT}/Navidrome/music:/music:ro

  ts-freshrss:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-freshrss
    hostname: freshrss
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-freshrss:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-freshrss-config:/config
    restart: unless-stopped

  freshrss:
    image: lscr.io/linuxserver/freshrss:1.29.1@sha256:7f7f276244da91720e40fee50dd0895b5d59d7888ea75a404ec7495c46fbfbb6
    container_name: freshrss
    network_mode: service:ts-freshrss
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${INFRA_ROOT}/nas/nas-services/freshrss/config:/config
    restart: unless-stopped

  ts-otterwiki:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-otterwiki
    hostname: otterwiki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-otterwiki:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-otterwiki-config:/config
    restart: unless-stopped

  otterwiki:
    image: redimp/otterwiki:2-slim@sha256:b3477b2b23a477f61cbc6989913e74289e6c11564711d074a1a906673051f468
    container_name: otterwiki
    restart: unless-stopped
    network_mode: service:ts-otterwiki
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - ts-otterwiki
    user: "568:568"
    environment:
      - TZ=Europe/Stockholm
      - AUTH_METHOD=SIMPLE
      - READ_ACCESS=APPROVED
      - WRITE_ACCESS=APPROVED
      - ATTACHMENT_ACCESS=APPROVED
      - DISABLE_REGISTRATION=False
      - AUTO_APPROVAL=False
      - EMAIL_NEEDS_CONFIRMATION=False
    volumes:
      - ${INFRA_ROOT}/nas/nas-services/otterwiki:/app-data

volumes:
  model-cache:
  tailscale-data-immich:
  tailscale-data-audiobookshelf:
  tailscale-data-navidrome:
  tailscale-data-freshrss:
  tailscale-data-otterwiki:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
