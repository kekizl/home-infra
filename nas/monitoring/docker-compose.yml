version: "3.8"

services:
  # ---- node-exporter ----
  ts-nas-node-exporter:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-nas-node-exporter
    hostname: nas-node-exporter
    secrets:
      - ts_authkey
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-node-exporter:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/monitoring/ts-node-exporter-config:/config
    restart: unless-stopped

  node-exporter:
    image: ghcr.io/vaskozl/prometheus-node-exporter:1.12.1@sha256:d4a260d6964aa158857fd8fb7d219765bce628ff65fb9d1ec159f4335fb33167
    container_name: node-exporter
    restart: unless-stopped
    network_mode: service:ts-nas-node-exporter
    depends_on:
      - ts-nas-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/root:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points='

volumes:
  tailscale-data-node-exporter:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
