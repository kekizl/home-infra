version: "3.8"

services:
  # ---- Prometheus ----
  ts-prometheus:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-prometheus
    hostname: prometheus
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-prometheus:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-prometheus-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    restart: unless-stopped
    network_mode: service:ts-prometheus
    depends_on:
      - ts-prometheus
    volumes:
      - ${INFRA_ROOT}/mac-mini/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  # ---- Grafana ----
  ts-grafana:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-grafana
    hostname: grafana
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-grafana:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-grafana-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.1
    container_name: grafana
    restart: unless-stopped
    network_mode: service:ts-grafana
    depends_on:
      - ts-grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${TS_TAILNET}.ts.net
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana

  # ---- cAdvisor ----
  ts-cadvisor:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-cadvisor
    hostname: cadvisor
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-cadvisor:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-cadvisor-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    restart: unless-stopped
    network_mode: service:ts-cadvisor
    depends_on:
      - ts-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # ---- node-exporter ----
  ts-node-exporter:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-node-exporter
    hostname: node-exporter
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-node-exporter:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-node-exporter-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter
    restart: unless-stopped
    network_mode: service:ts-node-exporter
    depends_on:
      - ts-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/root:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points='

  # ---- graphite-exporter ----
  ts-graphite-exporter:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-graphite-exporter
    hostname: graphite-exporter
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-graphite-exporter:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-graphite-exporter-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  graphite-exporter:
    image: prom/graphite-exporter:v0.16.0
    container_name: graphite-exporter
    restart: unless-stopped
    network_mode: service:ts-graphite-exporter
    depends_on:
      - ts-graphite-exporter
    command:
      - "--web.listen-address=0.0.0.0:9108"
      - "--graphite.listen-address=:2003"
      - "--graphite.mapping-config=/etc/graphite-exporter/graphite_mapping.conf"
    volumes:
      - ${INFRA_ROOT}/mac-mini/monitoring/graphite/graphite_mapping.conf:/etc/graphite-exporter/graphite_mapping.conf:ro 

  # ---- uptime-kuma ----
  ts-uptime-kuma:
    image: tailscale/tailscale:v1.94.2
    container_name: ts-uptime-kuma
    hostname: uptime-kuma
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-uptime-kuma:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-uptime-kuma-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.2.1
    container_name: uptime-kuma
    restart: unless-stopped
    network_mode: service:ts-uptime-kuma
    depends_on:
      - ts-uptime-kuma
    volumes:
      - ${INFRA_ROOT}/mac-mini/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - UPTIME_KUMA_HOST=0.0.0.0
      - UPTIME_KUMA_PORT=3001

volumes:
  prometheus_data:
  grafana_data:
  tailscale-data-prometheus:
  tailscale-data-grafana:
  tailscale-data-cadvisor:
  tailscale-data-node-exporter:
  tailscale-data-graphite-exporter:
  tailscale-data-uptime-kuma:
