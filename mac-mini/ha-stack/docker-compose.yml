version: "3.8"

services:
  whisper:
    image: rhasspy/wyoming-whisper:3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
    container_name: whisper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "10300:10300"
    volumes:
      - ${INFRA_ROOT}/mac-mini/ha-stack/data/whisper:/data
    command: --model small-int8 --language en
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
    container_name: piper
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "10200:10200"
    volumes:
      - ${INFRA_ROOT}/mac-mini/ha-stack/data/piper:/data
    command: --voice en_US-glados-medium
    restart: unless-stopped

  openwakeword:
    image: rhasspy/wyoming-openwakeword:2.1.0@sha256:52cb1168731a1849fc28cf339c935fde58746bbabc94226668a40ef6ddf5d42b
    container_name: openwakeword
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "10400:10400"
    volumes:
      - ${INFRA_ROOT}/mac-mini/ha-stack/data/openwakeword:/custom
    command: --preload-model ok_glados --custom-model-dir /custom
    restart: unless-stopped
