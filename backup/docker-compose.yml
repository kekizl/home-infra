# backup/mac-mini-backup.yml
services:
  backup:
    image: offen/docker-volume-backup:v2
    restart: always
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_RETENTION_DAYS: 7
    volumes:
      # Named volumes
      - grafana_data:/backup/grafana:ro
      - openwebui_data:/backup/openwebui:ro

      # Bind mounts (use exact paths from your host)
      - ${INFRA_ROOT}/mac-mini/data:/backup/uptime-kuma:ro
      - ${INFRA_ROOT}/mac-mini/services/vw-data:/backup/vaultwarden:ro
      - ${INFRA_ROOT}/mac-mini/dns/adguard/conf:/backup/adguard-conf:ro
      # - ${INFRA_ROOT}/mac-mini/dns/adguard/work:/backup/adguard-work:ro  # optional, large

      # Obsidian vault (adjust tilde to absolute path if needed)
      - /Users/keki/home-infra/mac-mini/obsidian/vault:/backup/obsidian:ro

      # Docker socket to stop labeled containers
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Target archive location
      - /local/backups/mac-mini:/archive

volumes:
  grafana_data:
  openwebui_data:
