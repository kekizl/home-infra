version: '3.8'

services:
  ts-immich:
    image: tailscale/tailscale:v1.98.8
    container_name: ts-immich
    hostname: immich
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-immich:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-immich-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.0.3
    volumes:
      - ${APPSTORAGE_ROOT}/immich/data:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - IMMICH_SERVER_EXTERNAL_DOMAIN=https://immich.${TS_TAILNET}.ts.net
    env_file:
      - ./db_secrets.enc.env
    network_mode: service:ts-immich
    depends_on:
      - ts-immich
      - redis
      - database
    restart: always

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.0.3
    env_file:
      - ./db_secrets.enc.env
    volumes:
      - model-cache:/cache
    restart: always

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9.1.0
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0
    env_file:
      - ./db_secrets.enc.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${APPSTORAGE_ROOT}/immich/immich_postgres16:/var/lib/postgresql/data
    restart: always

  ts-audiobookshelf:
    image: tailscale/tailscale:v1.98.8
    container_name: ts-audiobookshelf
    hostname: audiobookshelf
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-audiobookshelf:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-audiobookshelf-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    user: "568:568"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: service:ts-audiobookshelf
    depends_on:
      - ts-audiobookshelf
    volumes:
      - ${APPSTORAGE_ROOT}/Audiobookshelf/audiobooks:/audiobooks
      - ${APPSTORAGE_ROOT}/Audiobookshelf/podcasts:/podcasts
      - ${APPSTORAGE_ROOT}/Audiobookshelf/manga:/manga
      - ${APPSTORAGE_ROOT}/Audiobookshelf/config:/config
      - ${APPSTORAGE_ROOT}/Audiobookshelf/metadata:/metadata
    environment:
      - TZ=Europe/Stockholm
      - PUBLIC_URL=https://audiobookshelf.${TS_TAILNET}.ts.net
    restart: unless-stopped

  ts-navidrome:
    image: tailscale/tailscale:v1.98.8
    container_name: ts-navidrome
    hostname: navidrome
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-navidrome:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-navidrome-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  navidrome:
    image: deluan/navidrome:0.63.2
    container_name: navidrome
    network_mode: service:ts-navidrome
    depends_on:
      - ts-navidrome
    user: 568:568
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - ND_DATAFOLDER=/data
      - ND_MUSICFOLDER=/music
      - ND_PORT=4533
      - ND_LOGLEVEL=info
    volumes:
      - ${APPSTORAGE_ROOT}/Navidrome/data:/data
      - ${APPSTORAGE_ROOT}/Navidrome/music:/music:ro

  ts-freshrss:
    image: tailscale/tailscale:v1.98.8
    container_name: ts-freshrss
    hostname: freshrss
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-freshrss:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/nas-services/ts-freshrss-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  freshrss:
    image: lscr.io/linuxserver/freshrss:1.29.1
    container_name: freshrss
    network_mode: service:ts-freshrss
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${INFRA_ROOT}/nas/nas-services/freshrss/config:/config
    restart: unless-stopped

volumes:
  model-cache:
  tailscale-data-immich:
  tailscale-data-audiobookshelf:
  tailscale-data-navidrome:
  tailscale-data-freshrss:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
