commands:
    dry_run: true
    cross_seed: false
    recheck: false
    cat_update: false
    tag_update: false
    rem_unregistered: true
    tag_tracker_error: false
    rem_orphaned: true
    tag_nohardlinks: true
    share_limits: true
    skip_cleanup: false
    skip_qb_version_check: false
qbt:
    host: "ts-qbittorrent:55555"
    user: !ENV QBT_USER
    pass: !ENV QBT_PASS
settings:
    force_auto_tmm: false
    tracker_error_tag: issue
    nohardlinks_tag: noHL
    share_limits_suffix_tag: share_limit
    ignoreTags_OnUpdate:
        - noHL
        - issue
        - cross-seed
    stalled_tag: stalledDL
    tag_stalled_torrents: true    
directory:
    root_dir: /downloads/
    orphaned_dir: /downloads/orphaned_data
    recycle_bin: /downloads/.RecycleBin
cat:
    lidarr: /downloads
tracker:
    other:
        tag: other
nohardlinks:
    - lidarr
share_limits:
    noHL:
        priority: 1
        include_all_tags:
            - noHL
        categories:
            - lidarr
        max_seeding_time: 6h
        cleanup: true
recyclebin:
    enabled: true
    empty_after_x_days: 14
    save_torrents: false
    split_by_category: false
webhooks:
    error: null
    run_start: null
    run_end: null
    function:
        cross_seed: null
        recheck: null
        cat_update: null
        tag_update: null
        rem_unregistered: null
        tag_tracker_error: null
        rem_orphaned: null
        tag_nohardlinks: null
        cleanup_dirs: null
orphaned:
    empty_after_x_days: 2
    exclude_patterns: null
    max_orphaned_files_to_delete: 500

