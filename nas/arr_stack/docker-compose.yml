services:
  ts-qbittorrent:
    image: tailscale/tailscale:v1.98.9
    container_name: ts-qbittorrent
    hostname: qbittorrent
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TS_AUTH_ONCE=true
    volumes:
      - tailscale-data-qbittorrent:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/arr_stack/ts-qbittorrent-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - arr-internal

  qbittorrent:
    image: ghcr.io/vaskozl/qbittorrent-nox:5.2.1
    container_name: qbittorrent
    network_mode: service:ts-qbittorrent
    depends_on:
      - ts-qbittorrent
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/qBittorrent/config:/config
      - /mnt/Pool/downloads:/downloads
    restart: unless-stopped

  ts-prowlarr:
    image: tailscale/tailscale:v1.98.9
    container_name: ts-prowlarr
    hostname: prowlarr
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-prowlarr:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/arr_stack/ts-prowlarr-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - arr-internal

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls154
    container_name: prowlarr
    network_mode: service:ts-prowlarr
    depends_on:
      - ts-prowlarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/prowlarr/config:/config
    restart: unless-stopped

  ts-lidarr:
    image: tailscale/tailscale:v1.98.9
    container_name: ts-lidarr
    hostname: lidarr
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-lidarr:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/arr_stack/ts-lidarr-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - arr-internal

  lidarr:
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls35
    container_name: lidarr
    network_mode: service:ts-lidarr
    depends_on:
      - ts-lidarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/lidarr/config:/config
      - /mnt/Pool/downloads:/downloads
      - ${APPSTORAGE_ROOT}/Navidrome/music:/music
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Stockholm
    restart: unless-stopped
    networks:
      - arr-internal

  qbit-manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.10.0
    container_name: qbit-manage
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
      - QBT_RUN=true
      - QBT_SCHEDULE=60         # run every 30 minutes
      - QBT_CONFIG=/config/config.yml
      - QBT_LOG_LEVEL=INFO
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/qbit-manage/config:/config
      - /mnt/Pool/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr-internal
    depends_on:
      qbittorrent:
        condition: service_started

networks:
  arr-internal:
    driver: bridge

volumes:
  tailscale-data-qbittorrent:
  tailscale-data-prowlarr:
  tailscale-data-lidarr:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
