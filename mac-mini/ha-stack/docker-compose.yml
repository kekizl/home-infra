version: "3.8"

services:
  whisper:
    image: rhasspy/wyoming-whisper:3.1.0
    container_name: whisper
    ports:
      - "10300:10300"
    volumes:
      - ${INFRA_ROOT}/mac-mini/ha-stack/data/whisper:/data
    command: --model small-int8 --language en
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:2.2.2
    container_name: piper
    ports:
      - "10200:10200"
    volumes:
      - ${INFRA_ROOT}/mac-mini/ha-stack/data/piper:/data
    command: --voice en_US-glados-medium
    restart: unless-stopped

  openwakeword:
    image: rhasspy/wyoming-openwakeword:1.10.0
    container_name: openwakeword
    ports:
      - "10400:10400"
    volumes:
      - ${INFRA_ROOT}/mac-mini/ha-stack/data/openwakeword:/custom
    command: --preload-model ok_glados --custom-model-dir /custom
    restart: unless-stopped
