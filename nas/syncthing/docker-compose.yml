version: "3.8"

services:
  ts-syncthing:
    image: tailscale/tailscale:v1.98.4
    container_name: ts-syncthing
    hostname: syncthing
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-syncthing:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/syncthing/ts-syncthing-config:/config
    cap_add:
      - NET_ADMIN
    networks:
      - net_edge
    restart: unless-stopped

  syncthing:
    image: ghcr.io/vaskozl/syncthing:2.1.1@sha256:c8d0e573a419e80f0247ec7b1f3d726698d461f2070777cef7025b1b5c3de8ac
    container_name: syncthing
    restart: unless-stopped
    depends_on:
      - ts-syncthing
    user: "568:568"
    environment:
      - HOME=/var/syncthing
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - ${INFRA_ROOT}/nas/syncthing/data:/var/syncthing/.local/state/syncthing
      - /mnt/Pool/sync-bucket:/incoming
      - /mnt/Pool/Syncthing/vw:/sync/vw
    networks:
      - net_syncthing
    sysctls:
      - net.ipv6.bindv6only=0 #To allow IPv4

volumes:
  tailscale-data-syncthing:

networks:
  net_edge:
    name: net_edge
    driver: bridge
    external: true

  net_syncthing:
    name: net_syncthing
    driver: bridge

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
