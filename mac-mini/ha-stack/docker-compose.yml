version: "3.8"

services:
  whisper:
    image: rhasspy/wyoming-whisper:3.1.0
    container_name: whisper
    ports:
      - "10300:10300"
    volumes:
      - $HomeInfra/mac-mini/ha-stack/data/whisper:/data
    command: --model medium-int8 --language en
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper:2.2.2
    container_name: piper
    ports:
      - "10200:10200"
    volumes:
      - $HomeInfra/mac-mini/ha-stack/data/piper:/data
    command: --voice en_US-glados-medium
    restart: unless-stopped
