version: "3.9"

services:
  doco-cd:
    image: ghcr.io/kimdre/doco-cd:0.138.0@sha256:9d8d10b795f7ef4372088475fd16277d7b79a0e85434fbfc34270e26fb90ddea
    container_name: doco-cd
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./doco-cd-data:/data       # persistent logs/cache
      - /var/run/docker.sock:/var/run/docker.sock  # needed for docker-compose deploys
#    ports:
#      - "9080:80"  # optional health/metrics endpoint. Unnecessary if used with polling
    environment:
      LOG_LEVEL: DEBUG
      PASS_ENV: "true"
      SOPS_AGE_KEY_FILE: /run/secrets/sops_age_key
      TZ: Europe/Stockholm
      POLL_CONFIG: |
        - url: https://github.com/kekizl/home-infra.git
          reference: main
          interval: 1800
          target: ${DOCO_CD_TARGET}
    secrets:
      - sops_age_key
    dns:
      - 8.8.8.8  # to avoid circular dependency with AdguardHome
    labels:
      - "docker-volume-backup.stop-during-backup=true"

networks:
  proxy:
    driver: bridge

volumes:
  data:

secrets:
  sops_age_key:
    file: ../.config/sops/age/sops_age_key.txt
