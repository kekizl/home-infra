version: "3.8"

services:
  # ---- node-exporter ----
  ts-nas-node-exporter:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-nas-node-exporter
    hostname: nas-node-exporter
    secrets:
      - ts_authkey
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-node-exporter:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/monitoring/ts-node-exporter-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  node-exporter:
    image: ghcr.io/vaskozl/prometheus-node-exporter:1.12.1@sha256:09a85cbd865e38ddd5de3b890d1d677edb9d15007975d10450b2ab15f32c738a
    container_name: node-exporter
    restart: unless-stopped
    network_mode: service:ts-nas-node-exporter
    depends_on:
      - ts-nas-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/root:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points='

volumes:
  tailscale-data-node-exporter:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
