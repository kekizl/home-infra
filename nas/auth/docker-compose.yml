services:
  caddy:
    image: caddy:2.11.4
    container_name: caddy
    expose:
      - "8080"
    volumes:
      - ${INFRA_ROOT}/nas/auth/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      - net_auth
      - net_edge
      - net_syncthing
    dns:
      - 100.100.100.100
      - 127.0.0.11
    restart: unless-stopped

  ts-pocket-id:
    image: tailscale/tailscale:v1.98.8
    container_name: ts-pocket-id
    hostname: auth
    secrets:
      - ts_authkey
    environment:
      TS_AUTHKEY_FILE: /run/secrets/ts_authkey
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: true
    volumes:
      - tailscale-data-pocket-id:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/auth/ts-pocket-id-config:/config
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - net_edge
    restart: unless-stopped

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.9.0
    container_name: pocket-id
    restart: unless-stopped
    env_file: auth.env
    volumes:
      - ${INFRA_ROOT}/nas/auth/pocket-id-data:/app/data
    networks:
      - net_auth
    depends_on:
      - ts-pocket-id

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: oauth2-proxy
    restart: unless-stopped
    env_file: auth.env
    networks:
      - net_auth
    dns:
      - 100.100.100.100
      - 127.0.0.11

volumes:
  caddy_data:
  tailscale-data-pocket-id:

networks:
  net_edge:
    name: net_edge
    driver: bridge
  net_auth:
    name: net_auth
    driver: bridge
  net_syncthing:
    name: net_syncthing
    driver: bridge
    external: true

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
