services:
  ts-mc:
    image: tailscale/tailscale:v1.102.5
    container_name: ts-mc
    hostname: mc
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-data-mc:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - mc-net

  backup:
    image: itzg/mc-backup:2026.9.2
    container_name: mc-backup
    network_mode: service:ts-mc
    restart: unless-stopped
    depends_on:
      - mc
    user: "568:568"
    secrets:
      - rcon_password
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      TZ: "Europe/Stockholm"
      BACKUP_METHOD: "rsync"
      LINK_LATEST: "true"
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "2m"
      BACKUP_ON_STARTUP: "true"
    volumes:
      - ${MC_ROOT}/data:/data:ro
      - ${MC_ROOT}/backups:/backups

  mc:
    image: itzg/minecraft-server:2026.9.2-java25
    container_name: mc
    network_mode: service:ts-mc
    depends_on:
      - ts-mc
    secrets:
      - rcon_password
    environment:
      EULA: "TRUE"
      DIFFICULTY: "normal"
      MEMORY: "4G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      UID: "568"
      GID: "568"
      TZ: "Europe/Stockholm"
    volumes:
      - ${MC_ROOT}/data:/data
    restart: unless-stopped

networks:
  mc-net:
    driver: bridge

volumes:
  tailscale-data-mc:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
  rcon_password:
    file: ../../secrets/rcon-password.enc.txt
