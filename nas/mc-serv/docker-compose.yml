services:
  ts-mc:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-mc
    hostname: mc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_AUTH_ONCE=true
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-data-mc:/var/lib/tailscale
    restart: unless-stopped
    networks:
      - mc-net

  backup:
    image: itzg/mc-backup:2026.11.0@sha256:a68dee00b2b56bd443bee7d310e5fc49e66682c0d1f4040cda6efa52d8c51df8
    container_name: mc-backup
    network_mode: service:ts-mc
    restart: unless-stopped
    depends_on:
      - mc
    user: "568:568"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - rcon_password
    environment:
      RCON_HOST: "127.0.0.1"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      TZ: "Europe/Stockholm"
      BACKUP_METHOD: "rsync"
      LINK_LATEST: "true"
      BACKUP_INTERVAL: "6h"
      INITIAL_DELAY: "2m"
      BACKUP_ON_STARTUP: "true"
    volumes:
      - ${MC_ROOT}/data:/data:ro
      - ${MC_ROOT}/backups:/backups

  mc:
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    container_name: mc
    network_mode: service:ts-mc
    depends_on:
      - ts-mc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    secrets:
      - rcon_password
    environment:
      EULA: "TRUE"
      DIFFICULTY: "normal"
      MEMORY: "4G"
      RCON_PASSWORD_FILE: "/run/secrets/rcon_password"
      UID: "568"
      GID: "568"
      TZ: "Europe/Stockholm"
    volumes:
      - ${MC_ROOT}/data:/data
    restart: unless-stopped

networks:
  mc-net:
    driver: bridge

volumes:
  tailscale-data-mc:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
  rcon_password:
    file: ../../secrets/rcon-password.enc.txt
