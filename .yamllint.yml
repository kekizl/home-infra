extends: default
ignore: |
  nas/arr_stack/qbit-manage/config/config.yml
rules:
  line-length:
    max: 120
    level: warning
  comments:
    min-spaces-from-content: 1
  truthy:
    allowed-values: ["true", "false"]   # catches "yes"/"no" which Docker ignores
  indentation:
    spaces: 2
    indent-sequences: consistent
