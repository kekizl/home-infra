services:
  ts-homepage:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-homepage
    hostname: homepage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json   # optional, enables HTTPS
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-homepage:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/services/ts-homepage-config:/config          # mount folder for serve.json
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    container_name: homepage
    user: "568:568"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: service:ts-homepage
    depends_on:
      - ts-homepage
    volumes:
      - ${INFRA_ROOT}/mac-mini/services/homepage/config:/app/config:ro
      - ${INFRA_ROOT}/mac-mini/services/homepage/images:/app/public/images
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.${TS_TAILNET}.ts.net
      PGHOMEPAGE_VAR_YOURVAR: value  # optional env vars for secrets
    labels:
      - "docker-volume-backup.stop-during-backup=true"

  ts-vaultwarden:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-vaultwarden
    hostname: vaultwarden
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-vaultwarden:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/services/ts-vaultwarden-config:/config
    restart: unless-stopped

  vaultwarden:
    image: vaultwarden/server:1.37.5@sha256:4fe17f415f90087377d37c755e0ea3cf189dcc6794e49cdd2a9adbb4937d9e1f
    container_name: vaultwarden
    restart: unless-stopped
    network_mode: service:ts-vaultwarden
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - ts-vaultwarden
    secrets:
      - vw-admin-token
    environment:
      DOMAIN: https://vaultwarden.${TS_TAILNET}.ts.net
      TRUST_PROXY: true
      ADMIN_TOKEN_FILE: /run/secrets/vw-admin-token
    volumes:
      - vaultwarden_data:/data/
    labels:
      - "docker-volume-backup.stop-during-backup=true"

  renovate:
    image: renovate/renovate:44.221.6@sha256:52454eae0bdcb51ddfecc39035e0fc2d97172751124049144e89d44343f6ae81
    container_name: renovate
    restart: no
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - renovate-token
    environment:
      RENOVATE_TOKEN_FILE: /run/secrets/renovate-token
      LOG_LEVEL: info
      RENOVATE_AUTODISCOVER: false
      RENOVATE_REPOSITORIES: kekizl/home-infra
      RENOVATE_PLATFORM: github
      RENOVATE_ONBOARDING: false
    volumes:
      - ./renovate-data:/usr/src/app/tmp
      - ./renovate-wrapper.sh:/usr/local/bin/renovate-wrapper.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/renovate-wrapper.sh"]
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "30 1 * * *"
      cd.doco.job.execution_mode: "one_off"
      cd.doco.job.skip_running: "true"

  restic-backup:
    build:
      context: .
      dockerfile: Dockerfile.restic
    container_name: restic-backup
    restart: no
    # Keep container alive for exec
    entrypoint: ["/bin/sh", "/backup.sh"]
    secrets:
      - restic-password
      - discord-webhook
      - restic-offsite-password
    environment:
      BACKUP_HOST: mac-mini
      BACKUP_TAG: mac-mini
      BACKUP_PATHS: >-
        /backup/grafana /backup/uptime-kuma /backup/vaultwarden
        /backup/adguard-conf /backup/obsidian
      STOP_LABEL: docker-volume-backup.stop-during-backup=true
      RESTIC_REPOSITORY: "rest:http://192.168.0.41:8000/mac-mini"
      OFFSITE_REPOSITORY: "rest:https://restic.sko.ai/chris/mac-mini"
      OFFSITE_USER: chris
      OFFSITE_PASSWORD_FILE: /run/secrets/restic-offsite-password
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      DISCORD_WEBHOOK_FILE: /run/secrets/discord-webhook
    volumes:
      # Named volumes – direct, read‑only
      - monitoring_grafana_data:/backup/grafana:ro
      - vaultwarden_data:/backup/vaultwarden:ro
      # Bind mounts – host paths
      - ${INFRA_ROOT}/mac-mini/data:/backup/uptime-kuma:ro
      - ${INFRA_ROOT}/mac-mini/dns/adguard/conf:/backup/adguard-conf:ro
      - ${INFRA_ROOT}/mac-mini/obsidian/vault:/backup/obsidian:ro
      # Docker socket (to stop containers)
      - /var/run/docker.sock:/var/run/docker.sock
      # Backup script
      - ${INFRA_ROOT}/scripts/restic-backup.sh:/backup.sh:ro
    labels:
      cd.doco.job.enabled: "true"
      cd.doco.job.schedule: "0 3 * * *"          # daily at 3 am
      cd.doco.job.execution_mode: "one_off"
      cd.doco.job.skip_running: "true"

volumes:
  tailscale-data-homepage:
    driver: local
  tailscale-data-vaultwarden:
  monitoring_grafana_data:
    external: true
  vaultwarden_data:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
  restic-password:
    file: ../../secrets/restic.enc.txt
  restic-offsite-password:
    file: ../../secrets/restic-offsite-password.enc.txt
  discord-webhook:
    file: ../../secrets/discord-webhook.enc.txt
  renovate-token:  # to create the pull requests
    file: ../../secrets/renovate-token.enc.txt
  vw-admin-token:
    file: ../../secrets/vw-admin-token.enc.txt
