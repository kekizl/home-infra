services:
  ts-qbittorrent:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-qbittorrent
    hostname: qbittorrent
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TS_AUTH_ONCE=true
    volumes:
      - tailscale-data-qbittorrent:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/arr_stack/ts-qbittorrent-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - arr-internal

  qbittorrent:
    image: ghcr.io/vaskozl/qbittorrent-nox:5.3.0@sha256:661679db31b3517cff95cd360ffad07b380cc37c6d7ce558fd3f5a6070f9425d
    container_name: qbittorrent
    network_mode: service:ts-qbittorrent
    depends_on:
      - ts-qbittorrent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "568:568"
    environment:
      - HOME=/config
      - XDG_CONFIG_HOME=/config
      - XDG_DATA_HOME=/config
      - TZ=Europe/Stockholm
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/qBittorrent/config:/config
      - /mnt/Pool/downloads:/downloads
    restart: unless-stopped

  ts-prowlarr:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-prowlarr
    hostname: prowlarr
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-prowlarr:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/arr_stack/ts-prowlarr-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - arr-internal

  prowlarr:
    image: ghcr.io/vaskozl/prowlarr:2.6.6.5717-r0@sha256:3b84e4618eca7393c8e916c3c889597755863624f42979c072f0bba77ba0c350
    container_name: prowlarr
    network_mode: service:ts-prowlarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - ts-prowlarr
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/prowlarr/config:/config
    restart: unless-stopped

  ts-lidarr:
    image: tailscale/tailscale:v1.104.4@sha256:ed6480b33c6eb67c9cbd203ed42b9fb57e361986725b6856def71b7a3d9e276c
    container_name: ts-lidarr
    hostname: lidarr
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-lidarr:/var/lib/tailscale
      - ${INFRA_ROOT}/nas/arr_stack/ts-lidarr-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - arr-internal

  lidarr:
    image: ghcr.io/vaskozl/lidarr:3.2.0.5144-r0@sha256:f6e9fb786bc963e6ac4c89e01b9fa035bc652ea506617c1aa10e9f40a13f6fe5
    container_name: lidarr
    network_mode: service:ts-lidarr
    depends_on:
      - ts-lidarr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/lidarr/config:/config
      - /mnt/Pool/downloads:/downloads
      - ${APPSTORAGE_ROOT}/Navidrome/music:/music
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Stockholm
    restart: unless-stopped
    networks:
      - arr-internal

  qbit-manage:
    image: ghcr.io/stuffanthings/qbit_manage:v4.14.0@sha256:0153204c727b8cd219c87cd22d5e5833e392436923577455e3c84ceb73835c7d
    container_name: qbit-manage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    env_file:
      - ../../secrets/qbt.enc.env
    environment:
      - PUID=568
      - PGID=568
      - TZ=Europe/Stockholm
      - QBT_RUN=false
      - QBT_SCHEDULE=30         # run every 30 minutes
      - QBT_CONFIG=/config/config.yml
      - QBT_LOG_LEVEL=INFO
    volumes:
      - ${INFRA_ROOT}/nas/arr_stack/qbit-manage/config:/config
      - /mnt/Pool/downloads:/downloads
    restart: unless-stopped
    networks:
      - arr-internal
    depends_on:
      qbittorrent:
        condition: service_started

networks:
  arr-internal:
    driver: bridge

volumes:
  tailscale-data-qbittorrent:
  tailscale-data-prowlarr:
  tailscale-data-lidarr:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
