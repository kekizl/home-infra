version: "3.8"

services:
  # ---- Prometheus ----
  ts-prometheus:
    image: tailscale/tailscale:v1.104.2
    container_name: ts-prometheus
    hostname: prometheus
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-prometheus:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-prometheus-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    restart: unless-stopped
    network_mode: service:ts-prometheus
    depends_on:
      - ts-prometheus
    volumes:
      - ${INFRA_ROOT}/mac-mini/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${INFRA_ROOT}/mac-mini/monitoring/ha-scrape.yml:/etc/prometheus/secrets/ha-scrape.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=0.0.0.0:9090"

  # ---- Grafana ----
  ts-grafana:
    image: tailscale/tailscale:v1.104.2
    container_name: ts-grafana
    hostname: grafana
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-grafana:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-grafana-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  grafana:
    image: ghcr.io/vaskozl/grafana:13.0.11
    container_name: grafana
    restart: unless-stopped
    network_mode: service:ts-grafana
    depends_on:
      - ts-grafana
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${TS_TAILNET}.ts.net
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      - "docker-volume-backup.stop-during-backup=true"

  # ---- cAdvisor ----
  ts-cadvisor:
    image: tailscale/tailscale:v1.104.2
    container_name: ts-cadvisor
    hostname: cadvisor
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-cadvisor:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-cadvisor-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    privileged: true
    restart: unless-stopped
    network_mode: service:ts-cadvisor
    depends_on:
      - ts-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # ---- node-exporter ----
  ts-node-exporter:
    image: tailscale/tailscale:v1.104.2
    container_name: ts-node-exporter
    hostname: node-exporter
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-node-exporter:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-node-exporter-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  node-exporter:
    image: ghcr.io/vaskozl/prometheus-node-exporter:1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: service:ts-node-exporter
    depends_on:
      - ts-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/root:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points='

  # ---- Loki ----
  ts-loki:
    image: tailscale/tailscale:v1.104.1
    container_name: ts-loki
    hostname: loki
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-loki:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-loki-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    container_name: loki
    restart: unless-stopped
    network_mode: service:ts-loki
    depends_on:
      - ts-loki
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ${INFRA_ROOT}/mac-mini/monitoring/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    labels:
      - "docker-volume-backup.stop-during-backup=true"

  # ---- Alloy ----
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ${INFRA_ROOT}/mac-mini/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

  # ---- uptime-kuma ----
  ts-uptime-kuma:
    image: tailscale/tailscale:v1.104.2
    container_name: ts-uptime-kuma
    hostname: uptime-kuma
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-uptime-kuma:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/monitoring/ts-uptime-kuma-config:/config
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:2.5.7
    container_name: uptime-kuma
    restart: unless-stopped
    network_mode: service:ts-uptime-kuma
    depends_on:
      - ts-uptime-kuma
    volumes:
      - ${INFRA_ROOT}/mac-mini/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - UPTIME_KUMA_HOST=0.0.0.0
      - UPTIME_KUMA_PORT=3001
    labels:
      - "docker-volume-backup.stop-during-backup=true"

volumes:
  prometheus_data:
  grafana_data:
  tailscale-data-prometheus:
  tailscale-data-grafana:
  tailscale-data-cadvisor:
  tailscale-data-node-exporter:
  tailscale-data-uptime-kuma:
  loki_data:
  alloy_data:
  tailscale-data-loki:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
