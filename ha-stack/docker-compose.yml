version: "3.8"

services:
  whisper:
    image: rhasspy/wyoming-whisper
    container_name: whisper
    ports:
      - "10300:10300"
    volumes:
      - ./data/whisper:/data
    command: --model medium-int8 --language en
    restart: unless-stopped

  piper:
    image: rhasspy/wyoming-piper
    container_name: piper
    ports:
      - "10200:10200"
    volumes:
      - ./data/piper:/data
    command: --voice en_US-ryan-low
    restart: unless-stopped

