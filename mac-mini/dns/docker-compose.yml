version: "3.9"

services:
  ts-adguard:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: ts-adguard
    hostname: adguard
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extends:
      file: ../../common/limits.yml
      service: tiny
    secrets:
      - ts_authkey
    environment:
      - TS_AUTHKEY_FILE=/run/secrets/ts_authkey
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json   # optional, enables HTTPS
      - TS_USERSPACE=true
    volumes:
      - tailscale-data-adguard:/var/lib/tailscale
      - ${INFRA_ROOT}/mac-mini/dns/ts-adguard-config:/config          # mount folder for serve.json
    restart: unless-stopped

  adguard-home:
    image: adguard/adguardhome:v1.0.0@sha256:f00a586f0d1caa74f149340bfb225014960310488ffa838406b89256900a96c2
    container_name: adguardhome
    restart: unless-stopped
    network_mode: service:ts-adguard
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    extends:
      file: ../../common/limits.yml
      service: small
    depends_on:
      - ts-adguard
    volumes:
      - ${INFRA_ROOT}/mac-mini/dns/adguard/work:/opt/adguardhome/work
      - ${INFRA_ROOT}/mac-mini/dns/adguard/conf:/opt/adguardhome/conf
    labels:
      - "docker-volume-backup.stop-during-backup=true"

volumes:
  tailscale-data-adguard:

secrets:
  ts_authkey:
    file: ../../secrets/ts-authkey.enc.txt
